<footer class="site-footer">
  <div class="container">

    {% if site.launch_date and site.launch_date != "" %}
    <div id="site-age" class="site-age" data-launch="{{ site.launch_date }}"></div>
    {% endif %}

    <p>
      &copy; {{ "now" | date: "%Y" }}
      <a href="{{ '/' | relative_url }}">{{ site.name | escape }}</a>
      · Powered by
      <a href="https://jekyllrb.com/">Jekyll</a>
    </p>

  </div>
</footer>

<script src="{{ '/assets/javascript/bootstrap/bootstrap.bundle.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/site.js' | relative_url }}"></script>

{% if site.launch_date and site.launch_date != "" %}
<script>
(function () {
  var el = document.getElementById('site-age');
  if (!el) return;
  var launchDate = new Date(el.getAttribute('data-launch') + 'T00:00:00');
  var now = new Date();
  var diff = now - launchDate;
  if (diff < 0) return;
  var days = Math.floor(diff / 86400000);
  el.textContent = '已上线 ' + days + ' 天';
})();
</script>
{% endif %}
