---
layout: null
---
{% assign words = site.name | split: " " %}<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="{{ site.accent_color | default: '#1a7a6d' }}"/>
  <text x="32" y="44" font-family="Georgia,serif" font-size="30" font-weight="700" fill="white" text-anchor="middle">{% if words.size > 1 %}{{ words.first | truncate: 1, "" }}{{ words.last | truncate: 1, "" }}{% else %}{{ site.name | truncate: 1, "" }}{% endif %}</text>
</svg>
